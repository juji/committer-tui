name: release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: bun-darwin-arm64
            asset: committer-darwin-arm64
          - os: macos-15-intel
            target: bun-darwin-x64
            asset: committer-darwin-x64
          - os: ubuntu-24.04-arm
            target: bun-linux-arm64
            asset: committer-linux-arm64
          - os: ubuntu-latest
            target: bun-linux-x64
            asset: committer-linux-x64
          - os: windows-latest
            target: bun-windows-x64
            asset: committer-windows-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: npm version --no-git-tag-version "${GITHUB_REF_NAME#v}"
        shell: bash
      - run: bun build --compile --target=${{ matrix.target }} src/index.tsx --outfile ${{ matrix.asset }}
      # macOS binaries are signed here — actions/upload-artifact zips and
      # re-extracts the file, which invalidates the ad-hoc signature before
      # it ever reaches the release.
      - if: runner.os == 'macOS'
        run: codesign --force -s - ${{ matrix.asset }}
      - name: Checksum (bash)
        if: runner.os != 'Windows'
        run: shasum -a 256 ${{ matrix.asset }} > ${{ matrix.asset }}.sha256
      - name: Checksum (windows)
        if: runner.os == 'Windows'
        run: (Get-FileHash ${{ matrix.asset }} -Algorithm SHA256).Hash.ToLower() + "  ${{ matrix.asset }}" | Out-File -Encoding ascii ${{ matrix.asset }}.sha256
        shell: pwsh
      - if: runner.os != 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256
      # macOS assets are uploaded to the release directly from this job — see
      # the codesign note above.
      - if: runner.os == 'macOS'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

  publish-npm:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Required for OIDC
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm version --no-git-tag-version "${GITHUB_REF_NAME#v}"
      - run: npm publish

